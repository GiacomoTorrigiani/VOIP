; ====================================================================
; Asterisk PJSIP Configuration for Ehiweb VivaVox
; Numero / Username: 07441590208
; Server SIP: sip.vivavox.it (Porta UDP 5060)
; ====================================================================

[general]
debug=no

; --- 1. Trasporto UDP ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/32

; --- 2. Registrazione SIP su Ehiweb VivaVox ---
[vivavox-reg]
type=registration
transport=transport-udp
outbound_auth=vivavox-auth
server_uri=sip:sip.vivavox.it:5060
client_uri=sip:07441590208@sip.vivavox.it:5060
retry_interval=30
max_retries=100
expiration=180
contact_user=07441590208

; --- 3. Autenticazione ---
[vivavox-auth]
type=auth
auth_type=userpass
username=07441590208
password=QNBUii7vF8-=
realm=sip.vivavox.it

; --- 4. Address of Record (AOR) ---
[vivavox-aor]
type=aor
contact=sip:sip.vivavox.it:5060
qualify_frequency=60

; --- 5. Endpoint ---
[vivavox-endpoint]
type=endpoint
transport=transport-udp
context=from-ehiweb
disallow=all
; Supporto codec g729, alaw (G.711a europeo) e ulaw
allow=g729
allow=alaw
allow=ulaw
aors=vivavox-aor
outbound_auth=vivavox-auth
from_user=07441590208
from_domain=sip.vivavox.it
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
timers=yes
timers_min_se=90

; --- 6. Identificazione Chiamate in Arrivo ---
[vivavox-identify]
type=identify
endpoint=vivavox-endpoint
match=sip.vivavox.it
