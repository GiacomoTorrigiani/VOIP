version: '3.8'

services:
  voip-backend:
    build: .
    container_name: voip-assistant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - API_SECRET_TOKEN=TorriflixVoip2026SecureKey!
      - USER_PHONE=3669650010
      - VOIP_BRIDGE_NUMBER=07441590208
      - RECORDINGS_DIR=/var/spool/asterisk/monitor
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - /var/spool/asterisk/monitor:/var/spool/asterisk/monitor
