[globals]
MONITOR_DIR=/var/spool/asterisk/monitor
PYTHON_BIN=/home/ubuntu/VOIP/server/venv/bin/python3
POST_PROCESSOR=/home/ubuntu/VOIP/server/post_call_processor.py

[telefono-ai-inbound]
exten => s,1,Goto(bridge,1)
exten => _X.,1,Goto(bridge,1)
exten => _+X.,1,Goto(bridge,1)

exten => bridge,1,NoOp(=== VOIP ASSISTANT: INCOMING CALL FROM ${CALLERID(num)} ID: ${UNIQUEID} ===)
 same => n,Answer()
 same => n,Set(REC_FILE=${MONITOR_DIR}/${UNIQUEID}.wav)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-voip-post-call,s,1(${UNIQUEID},${CALLER_NUM}))
 same => n,MixMonitor(${REC_FILE})
 same => n(loop),Playback(silence/1)
 same => n,Goto(loop)

[from-ehiweb]
exten => s,1,Goto(telefono-ai-inbound,bridge,1)
exten => _X.,1,Goto(telefono-ai-inbound,bridge,1)
exten => _+X.,1,Goto(telefono-ai-inbound,bridge,1)

[from-trunk-vivavox]
exten => s,1,Goto(telefono-ai-inbound,bridge,1)
exten => _X.,1,Goto(telefono-ai-inbound,bridge,1)
exten => _+X.,1,Goto(telefono-ai-inbound,bridge,1)

[sub-voip-post-call]
exten => s,1,NoOp(=== VOIP ASSISTANT: HANGUP FOR ID: ${ARG1} CALLER: ${ARG2} ===)
 same => n,StopMixMonitor()
 same => n,System(${PYTHON_BIN} ${POST_PROCESSOR} --uniqueid "${ARG1}" --caller "${ARG2}" > /var/log/asterisk/post_call_${ARG1}.log 2>&1 &)
 same => n,Return()
