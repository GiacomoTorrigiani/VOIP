; ====================================================================
; Asterisk Dialplan (extensions.conf) per Triangolazione Inversa
; Chiamata ponte al numero 07441590208 -> Registrazione silenziosa
; ====================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MONITOR_DIR=/var/spool/asterisk/monitor
PYTHON_BIN=/usr/bin/python3
POST_PROCESSOR=/opt/voip-backend/post_call_processor.py

[from-ehiweb]
; Intercetta qualsiasi chiamata in ingresso sul DID o numero registrato
exten => _X.,1,NoOp(--- Chiamata Ricevuta da: ${CALLERID(num)} per DID: ${EXTEN} - ID: ${UNIQUEID} ---)
 same => n,Answer()
 same => n,Set(REC_FILE=${MONITOR_DIR}/${UNIQUEID}.wav)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 ; Registra hangup handler per eseguire l'elaborazione non appena l'utente riaggancia
 same => n,Set(CHANNEL(hangup_handler_push)=sub-post-call-handler,s,1(${UNIQUEID},${CALLER_NUM}))
 ; Avvia la registrazione audio bidirezionale in alta qualità
 same => n,MixMonitor(${REC_FILE},b)
 ; Silenziamento microfono/audio lato server:
 ; Mantiene il canale aperto senza trasmettere alcun rumore o segnale di fondo alla conferenza
 same => n(loop),Wait(7200)
 same => n,Goto(loop)

exten => s,1,Goto(_X.,1)

; --- Sottoroutine Hangup: Trigger elaborazione post-chiamata ---
[sub-post-call-handler]
exten => s,1,NoOp(--- Hangup Rilevato per ID: ${ARG1} - Chiamante: ${ARG2} ---)
 same => n,StopMixMonitor()
 ; Lancia lo script Python di elaborazione con Gemini in background
 same => n,System(${PYTHON_BIN} ${POST_PROCESSOR} --uniqueid "${ARG1}" --caller "${ARG2}" > /var/log/asterisk/post_call_${ARG1}.log 2>&1 &)
 same => n,Return()
