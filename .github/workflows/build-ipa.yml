name: Build iOS IPA & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Build App for iOS (Unsigned)
        run: |
          xcodebuild build \
            -project VoIPAssistant.xcodeproj \
            -scheme VoIPAssistant \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: .app bundle non trovato!"
            exit 1
          fi
          echo "Trovato .app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoIPAssistant.ipa Payload
          ls -lh VoIPAssistant.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoIPAssistant-Unsigned-IPA
          path: VoIPAssistant.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "VoIP Assistant iOS v1.0.3"
          body: |
            ## 🚀 VoIP Assistant per iOS v1.0.3 (Unsigned .ipa)
            
            Nuova versione con supporto all'estrazione automatica di **Prompt Operativi AI**, integrazione rapida per **Google Gemini Pro / Deep Research**, trascrizione fonetica migliorata e pulizia delle mappe concettuali.
            
            ### Novità di v1.0.3:
            - **Nuova Sezione Prompt AI Operativi**: Rileva automaticamente compiti, dossier, ricerche o richieste avanzate concordate durante la telefonata.
            - **Prompt Ingegnerizzati Pronti all'Uso**: Ogni richiesta viene formattata con istruzioni chiare, contesto estratto e placeholder per allegati da incollare direttamente in Gemini.
            - **Integrazione Rapida con Google Gemini Web**: Pulsante dedicato per copiare il prompt negli appunti con feedback aptico e pulsante diretto per aprire `gemini.google.com/app` (utilizzando il tuo profilo con Gemini Pro, Deep Research e caricamento file).
            - **Trascrizione con Correzione Fonetica e Lessicale**: Algoritmo dual-pass per sanare le distorsioni tipiche dell'audio telefonico compresso a 8kHz.
            - **Mappe Concettuali Cmap Pulite**: Filtro stretto contro i meta-nodi superflui (es. "chiamata", "smartphone"), focalizzandosi unicamente sugli accordi e i temi discussi.
            
            ### Installazione con Feather / AltStore / TrollStore:
            Scarica il file `VoIPAssistant.ipa` allegato a questa release e installalo tramite la tua app di signing preferita.
          files: VoIPAssistant.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
