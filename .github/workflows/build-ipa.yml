name: Build iOS IPA & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Build App for iOS (Unsigned)
        run: |
          xcodebuild build \
            -project VoIPAssistant.xcodeproj \
            -scheme VoIPAssistant \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: .app bundle non trovato!"
            exit 1
          fi
          echo "Trovato .app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoIPAssistant.ipa Payload
          ls -lh VoIPAssistant.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoIPAssistant-Unsigned-IPA
          path: VoIPAssistant.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "VoIP Assistant iOS v1.0.2"
          body: |
            ## 🚀 VoIP Assistant per iOS v1.0.2 (Unsigned .ipa)
            
            Nuova versione con flusso di chiamata guidato a 3 vie:
            
            ### Novità di v1.0.2:
            - **Nuovo Flusso Diretto**: Cliccando un contatto dalla rubrica compare immediatamente la scheda con il numero VoIP (07441590208) e il tasto per aggiungere il destinatario alla chiamata.
            - **Passo 1 (VoIP Registratore)**: Chiama il centralino silenzioso con spiegazione chiara (chiamata gratuita in entrata).
            - **Passo 2 (Aggiungi Destinatario)**: Tasto dedicato per comporre il numero del contatto con il proprio cellulare reale (3669650010).
            - **Passo 3 (Unisci Chiamate)**: Guida visiva immediata per premere "Unisci" sul display di iOS.
            - **Notifica Banner Promemoria**: Ricevi un promemoria rapido per tornare all'app e unire la conferenza mentre sei in linea.
            - **Audio M4A / AAC Nativo**: Streaming e scrubbing dell'audio istantanei e fluidi su iOS.
            
            ### Installazione con Feather / AltStore:
            Scarica il file `VoIPAssistant.ipa` qui sotto e installalo con Feather, AltStore o TrollStore.
          files: VoIPAssistant.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
