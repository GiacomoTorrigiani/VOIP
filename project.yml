name: VoIPAssistant
options:
  bundleIdPrefix: com.torrigiani
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  defaultConfig: Release

targets:
  VoIPAssistant:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VoIPAssistant
    info:
      path: VoIPAssistant/Info.plist
      properties:
        CFBundleDisplayName: "VoIP Assistant"
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIUserInterfaceStyle: "Automatic"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSContactsUsageDescription: "L'applicazione necessita dell'accesso ai contatti per selezionare rapidamente il destinatario da chiamare."
        LSApplicationQueriesSchemes:
          - tel
          - googlecalendar
          - comgooglecalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torrigiani.voipassistant
        PRODUCT_NAME: VoIPAssistant
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: VoIPAssistant/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
